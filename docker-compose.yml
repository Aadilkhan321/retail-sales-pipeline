# Optional: a ready-made MySQL for this project.  Start with:  docker compose up -d
services:
  mysql:
    image: mysql:8.0
    container_name: retail-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: retail
    ports:
      - "3306:3306"
    volumes:
      - retail_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ppassword"]
      interval: 5s
      retries: 20
volumes:
  retail_mysql_data:
